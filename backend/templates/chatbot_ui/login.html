{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Voice AI | Login</title>

    <link rel="stylesheet" href="{% static 'chatbot_ui/css/style.css' %}">
</head>

<body class="login-page">

    <main class="login-wrapper">

        <section class="login-card">

            <!-- ============================================= -->
            <!-- Branding -->
            <!-- ============================================= -->

            <div class="login-brand">

                <div class="brand-icon">
                    🌾
                </div>

                <h1>
                    Farmer Voice AI
                </h1>

                <p>
                    Multilingual Agricultural Assistant
                </p>

            </div>


            <!-- ============================================= -->
            <!-- Login Heading -->
            <!-- ============================================= -->

            <div class="login-heading">

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Login to ask your farming questions
                    using text or voice.
                </p>

            </div>


            <!-- ============================================= -->
            <!-- Error Message -->
            <!-- ============================================= -->

            <div id="loginMessage" class="form-message" role="alert" hidden></div>


            <!-- ============================================= -->
            <!-- Login Form -->
            <!-- ============================================= -->

            <form id="loginForm" class="login-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" placeholder="farmer@example.com" autocomplete="email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="password" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>

                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
                            👁
                        </button>

                    </div>

                </div>


                <button type="submit" id="loginButton" class="primary-button">
                    <span id="loginButtonText">
                        Login
                    </span>

                    <span id="loginLoader" class="button-loader" hidden></span>
                </button>

            </form>


            <!-- ============================================= -->
            <!-- Feature Information -->
            <!-- ============================================= -->

            <div class="login-features">

                <span>
                    🎤 Voice Questions
                </span>

                <span>
                    💬 AI Answers
                </span>

                <span>
                    🔊 Voice Response
                </span>

            </div>


            <div class="login-footer">

                <p>
                    AI-powered agricultural guidance
                    using trusted knowledge sources.
                </p>

            </div>

        </section>

    </main>


    <script src="{% static 'chatbot_ui/js/login.js' %}"></script>

</body>

</html>
