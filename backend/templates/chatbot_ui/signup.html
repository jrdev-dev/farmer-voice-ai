{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Voice AI | Create Account</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'chatbot_ui/css/style.css' %}">
</head>

<body class="auth-page">

    <div class="auth-bg-decorations">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <main class="auth-container">
        
        <div class="auth-card">
            
            <!-- Branding Header -->
            <div class="auth-brand">
                <div class="brand-logo-badge">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a10 10 0 0 1 10 10c0 5.5-4.5 10-10 10S2 17.5 2 12A10 10 0 0 1 12 2z" fill="var(--primary)" opacity="0.15"/>
                        <path d="M12 22V12"/>
                        <path d="M12 12C12 7.5 7.5 6 7.5 6C7.5 10.5 12 12 12 12Z" fill="currentColor"/>
                        <path d="M12 15C12 11.5 16.5 10 16.5 10C16.5 13.5 12 15 12 15Z" fill="currentColor"/>
                    </svg>
                </div>
                <h1 class="brand-heading">Create Account</h1>
                <p class="brand-subtext">Join Farmer Voice AI for precision agriculture guidance</p>
            </div>

            <!-- Global Message Alert -->
            <div id="authMessage" class="auth-alert" role="alert" hidden></div>

            <!-- ======================================================= -->
            <!-- REGISTER FORM -->
            <!-- ======================================================= -->
            <form id="registerForm" class="auth-form active" action="javascript:void(0);">
                <div class="input-group">
                    <label for="regName">Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input type="text" id="regName" name="name" placeholder="Rajesh Kumar" autocomplete="name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regEmail">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </span>
                        <input type="email" id="regEmail" name="email" placeholder="farmer@example.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="regPassword" name="password" placeholder="Min 8 characters" autocomplete="new-password" required>
                        <button type="button" id="toggleRegPassword" class="pwd-toggle-btn" aria-label="Toggle Password">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regLanguage">Preferred Language</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="2" y1="12" x2="22" y2="12"/>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                            </svg>
                        </span>
                        <select id="regLanguage" name="preferred_language">
                            <option value="hi" selected>हिन्दी (Hindi)</option>
                            <option value="en">English</option>
                            <option value="hinglish">Hinglish</option>
                            <option value="mr">मराठी (Marathi)</option>
                            <option value="gu">ગુજરાતી (Gujarati)</option>
                            <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                            <option value="ta">தமிழ் (Tamil)</option>
                            <option value="te">తెలుగు (Telugu)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="registerSubmitBtn" class="btn-primary">
                    <span class="btn-label">Create Account</span>
                    <span class="btn-spinner" hidden></span>
                </button>
            </form>

            <!-- Navigation Link back to Dedicated Login Page -->
            <div class="auth-switch-prompt">
                <p>Already have an account? <a href="/" class="switch-link">Sign In →</a></p>
            </div>

            <!-- Feature Pills -->
            <div class="auth-features">
                <div class="feature-chip">Real-Time Voice STT</div>
                <div class="feature-chip">Comprehensive Crop Knowledge</div>
                <div class="feature-chip">Universal RAG Engine</div>
            </div>

            <footer class="auth-footer">
                <p>AI-Powered Precision Agriculture • Powered by Universal Hybrid RAG</p>
            </footer>

        </div>

    </main>

    <script src="{% static 'chatbot_ui/js/login.js' %}"></script>
</body>

</html>
